<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<title>Nayara</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;touch-action:none;}
canvas{display:block;}

/* ── BIENVENIDA ── */
#welcome{
  position:fixed;inset:0;z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#000;transition:opacity 1s ease;
}
#welcome.out{opacity:0;pointer-events:none;}
.ring{
  position:absolute;border-radius:50%;
  border:2px solid rgba(255,210,0,.45);
  animation:ringOut 2.6s ease-out infinite;top:50%;left:50%;
}
.ring:nth-child(2){animation-delay:.85s;}
.ring:nth-child(3){animation-delay:1.7s;}
@keyframes ringOut{
  0%{width:80px;height:80px;margin:-40px;opacity:.9;}
  100%{width:240px;height:240px;margin:-120px;opacity:0;}
}
#wsvg{
  width:140px;height:140px;
  animation:wFloat 3.5s ease-in-out infinite;
  filter:drop-shadow(0 0 28px rgba(255,200,0,.95));
}
@keyframes wFloat{
  0%,100%{transform:translateY(0) rotate(-5deg);}
  50%{transform:translateY(-18px) rotate(5deg);}
}
.wtitle{
  margin-top:28px;font-family:'Pacifico',cursive;
  font-size:clamp(1.4rem,6vw,2rem);color:#FFD700;
  text-shadow:0 0 30px rgba(255,200,0,.95),0 0 70px rgba(255,130,0,.5);
  text-align:center;line-height:1.5;
  animation:tglow 2.5s ease-in-out infinite alternate;
}
@keyframes tglow{
  from{text-shadow:0 0 20px rgba(255,200,0,.7);}
  to{text-shadow:0 0 55px #FFD700,0 0 90px rgba(255,130,0,.7);}
}
.taphint{
  margin-top:36px;font-size:clamp(.8rem,3vw,.95rem);
  color:rgba(255,215,0,.65);letter-spacing:.35em;text-transform:uppercase;
  animation:blink 2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:.3;}50%{opacity:1;}}

.pdrop{position:fixed;pointer-events:none;z-index:49;animation:pfall linear infinite;opacity:0;}
@keyframes pfall{
  0%{transform:translateY(-20px) rotate(0deg);opacity:0;}
  8%{opacity:.8;}92%{opacity:.5;}
  100%{transform:translateY(108vh) rotate(560deg);opacity:0;}
}

/* ── HUD TITULO ── */
#hud{
  position:fixed;top:0;left:0;right:0;
  text-align:left;z-index:20;padding:22px 28px 0;
  pointer-events:none;font-family:'Pacifico',cursive;
  font-size:clamp(1.3rem,5.5vw,2rem);
  color:#FFD700;
  text-shadow:0 0 20px rgba(255,220,0,1),0 0 40px rgba(255,180,0,.8),0 0 80px rgba(255,130,0,.5);
  opacity:0;transition:opacity 1.2s ease .8s;line-height:1.5;
}
#hud.show{opacity:1;}
#dhint{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  z-index:20;pointer-events:none;font-size:.68rem;
  color:rgba(255,215,0,.4);letter-spacing:.25em;text-transform:uppercase;
  opacity:0;transition:opacity 1s ease 2.2s;
}
#dhint.show{opacity:1;}

/* ── POPUP ── */
#overlay{
  position:fixed;inset:0;z-index:60;display:flex;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,0);pointer-events:none;transition:background .35s;
}
#overlay.show{background:rgba(0,0,0,.65);pointer-events:all;}
#popup{
  background:linear-gradient(135deg,rgba(18,8,0,.97),rgba(42,20,0,.97));
  border:1.5px solid rgba(255,215,0,.5);border-radius:28px;
  padding:38px 34px 30px;max-width:min(330px,88vw);width:100%;
  text-align:center;
  box-shadow:0 0 60px rgba(255,180,0,.3),0 0 120px rgba(255,100,0,.1);
  transform:scale(.6) translateY(40px);opacity:0;
  transition:transform .45s cubic-bezier(.34,1.56,.64,1),opacity .4s;
}
#overlay.show #popup{transform:scale(1) translateY(0);opacity:1;}
#pemoji{font-size:3rem;display:block;margin-bottom:14px;animation:rock 2s ease-in-out infinite alternate;}
@keyframes rock{from{transform:rotate(-7deg) scale(1);}to{transform:rotate(7deg) scale(1.1);}}
#pmsg{
  font-family:'Pacifico',cursive;font-size:clamp(.9rem,3.5vw,1.1rem);
  color:#FFF8E1;line-height:1.8;text-shadow:0 0 15px rgba(255,200,0,.3);
}
#psub{margin-top:14px;font-size:.72rem;color:rgba(255,200,100,.4);letter-spacing:.2em;text-transform:uppercase;}
#pclose{
  margin-top:26px;display:inline-block;padding:10px 30px;
  border:1px solid rgba(255,215,0,.4);border-radius:50px;
  color:rgba(255,215,0,.8);font-size:.72rem;letter-spacing:.2em;
  cursor:pointer;text-transform:uppercase;transition:background .2s;
}
#pclose:hover{background:rgba(255,215,0,.12);}
</style>
</head>

function makeSquareStars(){
  var group=new THREE.Group();
  var mat=new THREE.MeshBasicMaterial({color:0xFFFFFF, side:THREE.DoubleSide});

  for(var i=0;i<count;i++){

    /* Brillo variable */
    m.material.opacity=0.3+Math.random()*0.7;
    m.material.transparent=true;
    group.add(m);
  }
  scene.add(group);
  return group;
}

/* ══════════════════════════════
   TEXTURA DE GIRASOL REALISTA
══════════════════════════════ */
function makeFlowerTex(petalCol, centerCol){
  var sz=256;
  var cv=document.createElement('canvas');
  cv.width=cv.height=sz;
  var ctx=cv.getContext('2d');
  var cx=sz/2, r=sz/2, np=16;

  /* Pétalos externos — forma mas ovalada/puntiaguda como girasol real */
  for(var i=0;i<np;i++){
    var a=(i/np)*Math.PI*2;
    ctx.save(); ctx.translate(cx,cx); ctx.rotate(a);
    /* Gradiente en el pétalo */
    var pg=ctx.createLinearGradient(0,-r*.46,0,-r*.05);
    pg.addColorStop(0,'#FFEE00');
    pg.addColorStop(0.5, petalCol);
    pg.addColorStop(1,'#CC8800');
    ctx.beginPath();
    ctx.ellipse(0,-r*.4, r*.13, r*.38, 0, 0, Math.PI*2);
    ctx.fillStyle=pg; ctx.globalAlpha=.95; ctx.fill();
    ctx.restore();
  }
  /* Segunda capa de pétalos rotada */
  for(var i=0;i<np;i++){
    var a=(i/np)*Math.PI*2+Math.PI/np;
    ctx.save(); ctx.translate(cx,cx); ctx.rotate(a);
    var pg2=ctx.createLinearGradient(0,-r*.38,0,-r*.05);
    pg2.addColorStop(0,'#FFDD00');
    pg2.addColorStop(1,'#AA6600');
    ctx.beginPath();
    ctx.ellipse(0,-r*.3, r*.10, r*.28, 0, 0, Math.PI*2);
    ctx.fillStyle=pg2; ctx.globalAlpha=.7; ctx.fill();
    ctx.restore();
  }
  /* Centro oscuro con patrón espiral */
  ctx.globalAlpha=1;
  var cg=ctx.createRadialGradient(cx,cx,0,cx,cx,r*.28);
  cg.addColorStop(0,'#3D1A00');
  cg.addColorStop(0.4, centerCol);
  cg.addColorStop(0.8,'#2A0E00');
  cg.addColorStop(1,'#1A0800');
  ctx.beginPath(); ctx.arc(cx,cx,r*.28,0,Math.PI*2);
  ctx.fillStyle=cg; ctx.fill();

  /* Semillas en espiral de Fibonacci */
  ctx.fillStyle='rgba(0,0,0,.35)';
  for(var i=0;i<40;i++){
    var fa=(i*137.5)*Math.PI/180;
    var fr=Math.sqrt(i/40)*r*.22;
    ctx.beginPath();
    ctx.arc(cx+Math.cos(fa)*fr, cx+Math.sin(fa)*fr, r*.022, 0, Math.PI*2);
    ctx.fill();
  }
  /* Brillo en el centro */
  var cshine=ctx.createRadialGradient(cx-r*.05,cx-r*.05,0,cx,cx,r*.28);
  cshine.addColorStop(0,'rgba(255,200,100,.25)');
  cshine.addColorStop(1,'transparent');
  ctx.beginPath(); ctx.arc(cx,cx,r*.28,0,Math.PI*2);
  ctx.fillStyle=cshine; ctx.fill();

  return new THREE.CanvasTexture(cv);
}

var FT=[
  makeFlowerTex('#FFD700','#4A2000'),

/* ══════════════════════════════
   GIRASOL 3D — tallo + flor sprite grande
══════════════════════════════ */
function makeSunflower(px, pz, height, scale){
  var g=new THREE.Group();

  /* Tallo */
  var stemH=height*scale;
  var stem=new THREE.Mesh(
    new THREE.CylinderGeometry(0.06*scale, 0.12*scale, stemH, 8),
    new THREE.MeshStandardMaterial({color:0x2D5A1B, roughness:0.8})
  );
  stem.position.set(0, stemH/2 - 0.4, 0);
  stem.castShadow=true;
  g.add(stem);

  /* Hoja 1 */
  var leaf1=new THREE.Mesh(
    new THREE.SphereGeometry(0.5*scale, 6, 4),
    new THREE.MeshStandardMaterial({color:0x3A7020, roughness:0.9})
  );
  leaf1.scale.set(1, 0.18, 1.8);
  leaf1.position.set(0.5*scale, stemH*0.45, 0);
  leaf1.rotation.z=0.4;
  g.add(leaf1);

  /* Hoja 2 */
  if(height>2.5){
    var leaf2=new THREE.Mesh(
      new THREE.SphereGeometry(0.45*scale, 6, 4),
      new THREE.MeshStandardMaterial({color:0x2E6018, roughness:0.9})
    );
    leaf2.scale.set(1, 0.18, 1.6);
    leaf2.position.set(-0.45*scale, stemH*0.65, 0);
    leaf2.rotation.z=-0.4;
    g.add(leaf2);
  }

  /* Flor — sprite billboard */
  var ti=Math.floor(Math.random()*FT.length);
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({
    map:FT[ti], transparent:true, depthWrite:false,
    color:new THREE.Color(1, 0.97+Math.random()*0.03, 0.75+Math.random()*0.12)
  }));
  var fsz=(5.5+Math.random()*2)*scale;
  sp.scale.set(fsz, fsz, fsz);
  sp.position.set(0, stemH+0.2, 0);
  sp.userData.msg=rndMsg();
  sp.userData.isClick=true;
  g.add(sp);
  clickables.push(sp);

  g.position.set(px, -0.5, pz);
  return g;
}

/* ══════════════════════════════
   RAMO — usa la imagen real del ramo
══════════════════════════════ */
function makeBouquet(px, pz, count, sc){
  var g=new THREE.Group();

  /* Sprite del ramo real — billboard siempre de frente */
  /* Usamos un canvas placeholder dorado mientras carga la imagen */
  var spMat=new THREE.SpriteMaterial({
    map: BOUQUET_TEX,
    transparent:true,
    depthWrite:false,
    alphaTest:0.08
  });

  var sp=new THREE.Sprite(spMat);
  /* Escala: imagen del ramo es más alta que ancha */
  var w=(2.8+Math.random()*0.5)*sc;
  var h=w*1.0; /* imagen cuadrada */
  sp.scale.set(w, h, 1);
  sp.position.set(0, h*0.5-0.3, 0);
  sp.userData.msg=rndMsg();
  sp.userData.isClick=true;
  g.add(sp);
  clickables.push(sp);
  bouquetSprites.push(sp); /* registrar para cuando cargue la textura */

  g.position.set(px, -0.5, pz);
  return g;
}

/* Una sola funcion de label: blanco brillante con glow fuerte */
function makeLabel(text, yellow){
  /* Canvas grande para alta resolución */
  var W=1024, H=160;
  var cv=document.createElement('canvas');
  cv.width=W; cv.height=H;
  var ctx=cv.getContext('2d');
  ctx.clearRect(0,0,W,H);

  ctx.font='bold 68px Arial, sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';

  if(yellow){
    /* Amarillo brillante — como los titulos del video */
    /* capa glow exterior */
    ctx.shadowColor='rgba(255,230,0,1)';
    ctx.shadowBlur=50;
    ctx.fillStyle='rgba(255,240,0,0.4)';
    ctx.fillText(text, W/2, H/2);
    /* capa media */
    ctx.shadowBlur=28;
    ctx.fillStyle='rgba(255,245,60,0.75)';
    ctx.fillText(text, W/2, H/2);
    /* texto solido */
    ctx.shadowBlur=10;
    ctx.fillStyle='#FFF59D';
    ctx.fillText(text, W/2, H/2);
  } else {
    /* Blanco brillante — como los mensajes del video */
    ctx.shadowColor='rgba(255,255,255,1)';
    ctx.shadowBlur=50;
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.fillText(text, W/2, H/2);
    ctx.shadowBlur=28;
    ctx.fillStyle='rgba(255,255,255,0.7)';
    ctx.fillText(text, W/2, H/2);
    ctx.shadowBlur=8;
    ctx.fillStyle='#FFFFFF';
    ctx.fillText(text, W/2, H/2);
  }

  var tex=new THREE.CanvasTexture(cv);
  return tex;
}

  [-13,  1.0,   4,  false],
  [  6,  1.0, -13,  false],
  [ -7,  1.0,  12,  false],
  /* Anillo exterior — blancos grandes */
  [ 19,  0.8,   1,  false],

for(var lpi=0;lpi<lpositions.length;lpi++){

/* ══════════════════════════════
   RAYCASTER
══════════════════════════════ */
var ray=new THREE.Raycaster();
var m2=new THREE.Vector2();
function tryTap(cx,cy){
  m2.x=(cx/window.innerWidth)*2-1;
  m2.y=-(cy/window.innerHeight)*2+1;
  ray.setFromCamera(m2,camera);
  var hits=ray.intersectObjects(clickables,false);
  if(hits.length&&hits[0].object.userData.msg){
    showPopup(hits[0].object.userData.msg); return true;
  }
  return false;
}

/* ══════════════════════════════
   CAMARA ORBITAL + ZOOM
   - 1 dedo / mouse drag: rota horizontal Y vertical
   - 2 dedos / rueda: zoom
   - Tap sin movimiento: abre popup
══════════════════════════════ */

/* Estado orbital */
var camTheta = 0.3;        /* angulo horizontal (rad) */
var camPhi   = 1.1;        /* angulo vertical  (rad) — 0=cenit, PI/2=horizonte */
var camDist  = 28;         /* distancia al origen */
var AUTO_SPD = 0.0008;

var PHI_MIN  = 0.08;       /* casi desde arriba */
var PHI_MAX  = 1.45;       /* casi al ras del suelo */
var DIST_MIN = 8;
var DIST_MAX = 80;

function updateCamera(){
  camera.position.x = camDist * Math.sin(camPhi) * Math.sin(camTheta);
  camera.position.y = camDist * Math.cos(camPhi);
  camera.position.z = camDist * Math.sin(camPhi) * Math.cos(camTheta);
  camera.lookAt(0, 1, 0);
}
updateCamera();

var dragging=false, prevX=0, prevY=0, velX=0, velY=0, touchMoved=false;

/* ── MOUSE ── */
canvas.addEventListener('mousedown',function(e){
  dragging=true; prevX=e.clientX; prevY=e.clientY; velX=0; velY=0;
});
canvas.addEventListener('mousemove',function(e){
  if(!dragging) return;
  var dx=e.clientX-prevX, dy=e.clientY-prevY;
  if(Math.abs(dx)>2||Math.abs(dy)>2) touchMoved=true;
  velX = dx*0.004;
  velY = dy*0.004;
  camTheta -= velX;
  camPhi    = Math.max(PHI_MIN, Math.min(PHI_MAX, camPhi + velY));
  updateCamera();
  prevX=e.clientX; prevY=e.clientY;
});
canvas.addEventListener('mouseup',function(e){
  if(!dragging) return; dragging=false;
  if(!touchMoved) tryTap(e.clientX, e.clientY);
  touchMoved=false;
});
canvas.addEventListener('mouseleave',function(){ dragging=false; });

/* Zoom con rueda */
canvas.addEventListener('wheel',function(e){
  e.preventDefault();
  camDist = Math.max(DIST_MIN, Math.min(DIST_MAX, camDist + e.deltaY*0.04));
  updateCamera();
},{passive:false});

/* ── TOUCH ── */
/* IMPORTANTE: passive:false en touchstart y touchmove para poder
   llamar preventDefault() y evitar que Safari/Chrome intercepten
   el gesto de pellizco (zoom nativo del browser) */
var pinching=false, lastPinchDist=0;

canvas.addEventListener('touchstart',function(e){
  e.preventDefault(); /* bloquea scroll/zoom nativo del browser */
  touchMoved=false;
  if(e.touches.length===1){
    dragging=true; pinching=false;
    prevX=e.touches[0].clientX; prevY=e.touches[0].clientY;
    velX=0; velY=0;
  } else if(e.touches.length>=2){
    dragging=false; pinching=true;
    var dx=e.touches[0].clientX-e.touches[1].clientX;
    var dy=e.touches[0].clientY-e.touches[1].clientY;
    lastPinchDist=Math.sqrt(dx*dx+dy*dy);
  }
},{passive:false}); /* passive:false OBLIGATORIO para preventDefault */

canvas.addEventListener('touchmove',function(e){
  e.preventDefault(); /* CRUCIAL — sin esto el browser toma el zoom */
  if(e.touches.length===1 && dragging){
    var dx=e.touches[0].clientX-prevX, dy=e.touches[0].clientY-prevY;
    if(Math.abs(dx)>3||Math.abs(dy)>3) touchMoved=true;
    velX = dx*0.004;
    velY = dy*0.004;
    camTheta -= velX;
    camPhi    = Math.max(PHI_MIN, Math.min(PHI_MAX, camPhi + velY));
    updateCamera();
    prevX=e.touches[0].clientX; prevY=e.touches[0].clientY;
  } else if(e.touches.length>=2){
    /* PELLIZCO = ZOOM */
    touchMoved=true; pinching=true;
    var dx=e.touches[0].clientX-e.touches[1].clientX;
    var dy=e.touches[0].clientY-e.touches[1].clientY;
    var dist=Math.sqrt(dx*dx+dy*dy);
    if(lastPinchDist>0){
      var delta=lastPinchDist-dist; /* positivo=aleja, negativo=acerca */
      camDist=Math.max(DIST_MIN,Math.min(DIST_MAX, camDist+delta*0.08));
      updateCamera();
    }
    lastPinchDist=dist;
  }
},{passive:false}); /* passive:false OBLIGATORIO */

canvas.addEventListener('touchend',function(e){
  e.preventDefault();
  if(e.touches.length===0){
    if(!touchMoved && !pinching){
      var t=e.changedTouches[0];
      tryTap(t.clientX, t.clientY);
    }
    dragging=false; pinching=false; touchMoved=false; lastPinchDist=0;
  } else if(e.touches.length===1){
    pinching=false; lastPinchDist=0; dragging=true;
    prevX=e.touches[0].clientX; prevY=e.touches[0].clientY;
    touchMoved=false;
  }
},{passive:false});

/* ══════════════════════════════
   POPUP
══════════════════════════════ */
var overlay=document.getElementById('overlay');
var pemoji=document.getElementById('pemoji'),pmsg=document.getElementById('pmsg');
document.getElementById('pclose').addEventListener('click',function(){overlay.classList.remove('show');});
overlay.addEventListener('click',function(e){if(e.target===overlay)overlay.classList.remove('show');});
function showPopup(d){pemoji.textContent=d.e;pmsg.textContent=d.t;overlay.classList.add('show');}

/* ══════════════════════════════
   BIENVENIDA
══════════════════════════════ */
var welEl=document.getElementById('welcome');
var hudEl=document.getElementById('hud'),dhEl=document.getElementById('dhint');
var started=false;
function startScene(){
  if(started)return;started=true;
  welEl.classList.add('out');
  setTimeout(function(){welEl.style.display='none';},1000);
  hudEl.classList.add('show');dhEl.classList.add('show');
}
/* Múltiples formas de detectar el toque en bienvenida */
welEl.addEventListener('click', startScene);
welEl.addEventListener('touchend', function(e){
  e.preventDefault();
  startScene();
}, {passive:false});
/* Botón extra por si acaso */
document.getElementById('tap-btn').addEventListener('click', startScene);
document.getElementById('tap-btn').addEventListener('touchend', function(e){
  e.preventDefault();
  startScene();
}, {passive:false});

/* ══════════════════════════════
   LOOP DE ANIMACION
══════════════════════════════ */
var clock=new THREE.Clock();
var t=0;

/* Parpadeo de estrellas cuadradas — como en el video */
var starMeshes=squareStars.children;
var starTimers=[];
for(var i=0;i<starMeshes.length;i++){
  starTimers.push(Math.random()*Math.PI*2);
}

renderer.setAnimationLoop(function(){
  var dt=clock.getDelta(); t+=dt;

  /* Rotación automática — mueve camTheta en lugar del pivot */
  if(!dragging){
    velX*=0.92; velY*=0.92;
    camTheta += AUTO_SPD + velX;
    camPhi = Math.max(PHI_MIN, Math.min(PHI_MAX, camPhi + velY));
    updateCamera();
  }

  /* Anillo brilla y pulsa */
  ring3d.material.emissiveIntensity=3.5+Math.sin(t*2)*0.8;
  halo.material.opacity=0.14+Math.sin(t*1.5)*0.06;
  halo2.material.opacity=0.05+Math.sin(t*1.2)*0.03;
  ringLight.intensity=5+Math.sin(t*2.5)*2;

  /* Luz del sol pulsa levemente */
  sun.intensity=7+Math.sin(t*1.8)*1.5;

  /* Parpadeo de estrellas cuadradas */
  for(var i=0;i<starMeshes.length;i+=4){ /* cada 4 para no ser pesado */
    var bri=0.25+0.75*(0.5+0.5*Math.sin(t*0.8+starTimers[i]));
    starMeshes[i].material.opacity=bri;
  }

  /* Labels flotan suavemente */
  for(var i=0;i<labelSprites.length;i++){
    var ls=labelSprites[i];
    ls.sp.position.y=ls.baseY+Math.sin(t*0.6+ls.phase)*0.25;
  }

  renderer.render(scene,camera);
});

window.addEventListener('resize',function(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
